# ------------------------------------------------------------------------------
# Paths
# ------------------------------------------------------------------------------
# working_dir: Defines the base for relative output paths if used.
# If you run src/run.py from the ExcPhCoupl directory,
# "./calculation_output" would be ExcPhCoupl/calculation_output/
working_dir: "./calculation_output"

# Directory containing the 'qpoints_yambo' file and other Yambo SAVE data.
# This corresponds to self.data_dir in param.py.
# This value will override the default in param.py if param.py reads 'data_dir'.
data_dir: "/Users/keyneshdongol/Downloads/excph-devel(1)/yambo-qe-nk662-exp-lat/QPT6/dvscf/bn.save"

# Directory containing the ELPH NetCDF fragment files.
# This corresponds to self.elph_dir in param.py.
# This value will override the default in param.py if param.py reads 'elph_dir'.
elph_dir: "/Users/keyneshdongol/Downloads/excph-devel(1)/yambo-qe-nk662-exp-lat/QPT6/dvscf/bn.save/SAVE"

# NOTE on BSE data path (self.path_bse_data):
# The path for BSE data is initialized in ExcPhCoupl/src/common/param.py as:
# self.path_bse_data  = "/Users/keyneshdongol/Downloads/excph-devel(1)/yambo-qe-nk662-exp-lat/exciton/SAVE"
#
# The read_input_parameters method in param.py does NOT currently look for a 'bse_data_dir'
# or similar key in this YAML file to override self.path_bse_data.
#
# THEREFORE, FOR BSE DATA:
# 1. YOU MUST ENSURE the path shown above, which is hardcoded in
#    `ExcPhCoupl/src/common/param.py`'s `__init__` method, is correct and points
#    to your BSE NetCDF files (e.g., ndb.BS_diago_Q*).
# OR
# 2. Modify `ExcPhCoupl/src/common/param.py` to read a 'bse_data_dir' key
#    from this YAML. If you do that, you would add a key here like:
#    # bse_data_dir: "/Users/keyneshdongol/Downloads/excph-devel(1)/yambo-qe-nk662-exp-lat/exciton/SAVE"
#    And then in param.py's read_input_parameters:
#    # if 'bse_data_dir' in inp:
#    #     self.path_bse_data = os.path.join(self.working_dir, inp['bse_data_dir']) # if relative
#    #     # or self.path_bse_data = inp['bse_data_dir'] # if absolute

# Directory where the script will save its output .dat files and 'excph_dir'.
# This path is relative to 'working_dir' by default.
# This value will override the default in param.py if param.py reads 'output_data_dir'.
output_data_dir: "./output_files" # Will be working_dir/output_files

# ------------------------------------------------------------------------------
# Calculation Parameters (These will override defaults in param.py if read)
# ------------------------------------------------------------------------------
# Q-mesh for the calculation (determines N_Q). N_k is often set equal to N_Q.
Qmesh: [8, 8, 2] # Example: Results in N_Q = 8*8*2 = 128

# Number of valence bands involved in the excitonic states
N_v: 2
# Number of conduction bands involved in the excitonic states
N_c: 2

# Total number of bands used in the underlying el-ph calculation (from NetCDF files).
nbnds: 10 # Example: total bands in el-ph NetCDFs

# Number of electrons
N_e: 4 # (Typically 2 * number of occupied bands you consider part of N_v)

# Exciton states to consider.
alpha: 8
beta: 8  # Number of exciton states to calculate / use from BSE data

# ------------------------------------------------------------------------------
# Logging Configuration
# ------------------------------------------------------------------------------
LOG_LEVEL: DEBUG       # Options: DEBUG, INFO, WARNING, ERROR, CRITICAL
COLORED_LOGGING: TRUE # Use colored logs for terminal output (if supported)
# LOGFILE: "calculation.log" # Uncomment and set if COLORED_LOGGING is FALSE
