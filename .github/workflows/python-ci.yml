# .github/workflows/python-ci.yml

# This file defines a GitHub Actions workflow for Continuous Integration (CI).
# It automates the process of testing the code whenever changes are pushed to the repository.

# Name of the workflow as it will appear in the "Actions" tab of the GitHub repository.
name: Python Continuous Integration

# -----------------
# --- Triggers ----
# -----------------
# Specifies the events that will trigger this workflow to run.
on:
  # Trigger the workflow on push events to the "main" branch.
  # This is ideal for ensuring the main branch is always stable.
  push:
    branches: ["main", "develop"]

  # Trigger the workflow on pull request events targeting the "main" branch.
  # This is crucial for vetting changes before they are merged into the main codebase.
  pull_request:
    branches: ["main", "develop"]

  # Allows you to run this workflow manually from the Actions tab.
  # Useful for re-running tests or testing a specific commit.
  workflow_dispatch:

# -----------------
# ------ Jobs -----
# -----------------
# A workflow run is made up of one or more jobs that can run sequentially or in parallel.
jobs:
  # ====================================================================
  # Job 1: Run Serial Unit Tests
  # This job tests the core mathematical logic using pytest.
  # ====================================================================
  test-serial:
    name: "Test (Serial, Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install MPI libraries for import compatibility
        run: |
          sudo apt-get update
          sudo apt-get install -y mpich libmpich-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Generate unit test data
        run: python tests/generate_test_data.py

      - name: Run unit tests with pytest
        run: pytest tests/

  # ====================================================================
  # Job 2: Run Full Workflow in Parallel (MPI)
  # This job runs the full workflow with a small dataset to ensure that
  # the MPI execution path does not hang or crash. It does not check
  # for numerical correctness, only for successful completion.
  # ====================================================================
  test-parallel:
    name: "Test (Parallel, Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    # This job will only run if the 'test-serial' job has completed successfully.
    needs: test-serial
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install MPI libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y mpich libmpich-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # For the parallel test, we use the small, self-contained test data
      # instead of relying on large external datasets.
      - name: Generate small dataset for MPI run
        run: python tests/generate_test_data.py

      # We need a configuration file that points to the small test data.
      - name: Create a temporary config file for parallel test
        run: |
          cat <<EOF > config_test_mpi.yml
          working_dir: "."
          output_data_dir: "calculation_output"
          # These paths point to the small, generated test data
          data_dir: "tests/test_inputs"
          elph_dir: "tests/test_inputs"
          path_bse_data: "tests/test_inputs" # Assuming this gets used, otherwise it's harmless
          # Use small dimensions matching the test data
          Qmesh: [4, 1, 1] # Simplified for N_Q=4
          N_v: 2
          N_c: 2
          alpha: 2
          beta: 2
          N_e: 8
          nbnds: 10
          nmodes: 3
          LOG_LEVEL: DEBUG
          COLORED_LOGGING: TRUE
          EOF

      # We also need a qpoints file for the test run.
      - name: Create a temporary qpoints file for parallel test
        run: |
          mkdir -p tests/test_inputs
          cat <<EOF > tests/test_inputs/qpoints_yambo
          4
          0.0  0.0  0.0  1
          0.25 0.0  0.0  1
          0.5  0.0  0.0  1
          0.75 0.0  0.0  1
          EOF

      - name: Run full workflow with mpirun
        # This command runs the main application with 2 processes.
        # The test passes if the command exits with a status code of 0.
        # The `--use-hwthread-cpus` flag can help prevent resource conflicts on some runners.
        run: |
          mpirun -n 2 --use-hwthread-cpus python src/run.py -yml_inp config_test_mpi.yml
