# ------------------------------------------------------------------------------
# Paths
# ------------------------------------------------------------------------------
# Define a working directory. Other data paths can be relative to this.
# Example: If your project is in /path/to/ExcPhCoupl,
# and you want outputs in /path/to/ExcPhCoupl/calculation_results,
# set working_dir: ./calculation_results
# (The script will create output_data_dir if it doesn't exist)
working_dir: "./calculation_output" # Outputs will go here, relative to where src/run.py is executed or an absolute path

# Directory containing the 'qpoints_yambo' file and potentially other raw data.
# This path is relative to 'working_dir' if it doesn't start with '/'.
# YOU MUST UPDATE THIS PATH to where your 'qpoints_yambo' file is.
# Example: if working_dir is ./calculation_output and qpoints_yambo is in
# ../input_data/bn_save (relative to working_dir), then data_dir would be ../input_data/bn_save
data_dir: "../input_data/your_yambo_save_folder" # E.g., folder containing qpoints_yambo

# Directory containing the ELPH NetCDF fragment files (e.g., ndb.elph_gkkp_expanded_fragment_*)
# This path is relative to 'working_dir' if it doesn't start with '/'.
# YOU MUST UPDATE THIS PATH.
# Example: if working_dir is ./calculation_output and ELPH files are in
# ../input_data/elph_SAVE, then elph_dir would be ../input_data/elph_SAVE
elph_dir: "../input_data/your_elph_SAVE_folder" # Folder with elph NetCDF fragments

# Directory where the script will save its output .dat files (like g_elph.dat, ph_freq.dat)
# and the final 'excph_dir' with G matrix data.
# This path is relative to 'working_dir'.
output_data_dir: "./output_files"

# NOTE on BSE data path:
# The path for BSE data (used to set `p.path_bse_data`) is currently initialized
# directly in `ExcPhCoupl/src/common/param.py`.
# To make it configurable via this YAML file, you would need to:
# 1. Add a key here, for example:
#    bse_data_dir: "../input_data/your_bse_SAVE_folder" # Path relative to working_dir
# 2. Modify `ExcPhCoupl/src/common/param.py` in the `__init__` or `read_input_parameters`
#    method to read this `bse_data_dir` key and set `self.path_bse_data` accordingly.
#    For example, `self.path_bse_data = os.path.join(self.working_dir, inp['bse_data_dir'])`.
# For now, ensure `p.path_bse_data` in `param.py` points to your BSE NetCDF files,
# or modify `param.py` to use a path like:
# `self.path_bse_data = "/absolute/path/to/your_bse_SAVE_folder"`

# ------------------------------------------------------------------------------
# Calculation Parameters (Defaults from common/param.py or typical values)
# ------------------------------------------------------------------------------
# Q-mesh for the calculation (determines N_Q). N_k is often set equal to N_Q.
# This should match the number of Q-points in your Yambo/QE calculations
# and the number of fragment files for BSE and ELPH.
Qmesh: [8, 8, 2] # Example: Results in N_Q = 8*8*2 = 128

# Number of valence bands involved in the excitonic states
N_v: 2
# Number of conduction bands involved in the excitonic states
N_c: 2

# Total number of bands used in the underlying el-ph calculation (from NetCDF files).
# `read_elph_data` in `read_io.py` attempts to infer `actual_bands` from
# the NetCDF files. If this `nbnds` is different, it might lead to warnings or issues
# if the slicing logic in `read_io.py` (serial path, original version) was based on p.N_e.
# The MPI-merged version primarily relies on `actual_bands` from the sample file.
# This parameter (p.nbnds) might be used in other parts of the code.
nbnds: 10 # Example: total bands in el-ph NetCDFs

# Number of electrons (often 2 * N_v for non-spin-polarized, insulating systems)
# This parameter (p.N_e) was used in the original serial read_io.py for band slicing.
# Ensure this is consistent with your system.
N_e: 4 # (Typically 2 * number of occupied bands you consider part of N_v)

# Exciton states to consider.
# `beta` is typically the number of lowest energy exciton states to read from BSE files.
# `alpha` might be used as a lower bound or simply set equal to beta if you want the first `beta` states.
# In `read_bse_wavefunction`, data is sliced up to `p.beta`.
alpha: 8 # Often set similar to beta, or could be 1 if beta is the count
beta: 8  # Number of exciton states to calculate / use from BSE data

# ------------------------------------------------------------------------------
# Logging Configuration
# ------------------------------------------------------------------------------
LOG_LEVEL: DEBUG       # Options: DEBUG, INFO, WARNING, ERROR, CRITICAL
COLORED_LOGGING: TRUE # Use colored logs for terminal output (if supported)
# LOGFILE: "calculation.log" # Uncomment and set if COLORED_LOGGING is FALSE
